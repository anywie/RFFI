<div class="d-flex flex-wrap justify-content-between">
    <div class="video-wrapper d-flex col-lg-5 flex-column" *ngFor="let video of videos">
        <div class=" embed-responsive embed-responsive-16by9">
            <iframe class="embed-responsive-item" [src]='transform(video.link)'></iframe>
        </div>
        <div class="mt-3 videos-description">
            <h2>{{video.title}}</h2>
        </div>
    </div>
</div>
