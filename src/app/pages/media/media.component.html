<div class="d-flex flex-wrap justify-content-between">
    <div class="video-wrapper pb-3 d-flex col-lg-5 flex-column" *ngFor="let video of videos">
        <div class=" embed-responsive embed-responsive-16by9">
            <youtube-player [videoId]="video.url"></youtube-player>
        </div>
        <div class="mt-3 media-description">
            <div class="media_header">{{video.title}}</div>
            <div class="media_body">
                <div class="media_body-date">{{video.created_at | date : "dd MMM yyyy"}}</div>
                <div class="media_body-desc">{{video.desc}}</div>
            </div>
        </div>
    </div>
</div>
