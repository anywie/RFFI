<div class="container">
    <div class="row">
        <div class="participant_card  d-flex p-4" *ngFor="let author of authors | async" (click)="RedirectToAuthor(author)">
            <img class="img-fluid" src="{{author.photo.url}}" alt="" />
            <div class="">
                <div class="school_title m-3">{{author.authorName}}</div>
                <div class="school_desc m-3">{{author.email}}</div>
            </div>
        </div>
    </div>
</div>
